name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:assemblePlayDebug --no-daemon
      - name: Rename APK
        run: |
          APK=$(find . -path "*build/outputs/apk*" -name "*.apk" | head -n 1)
          cp "$APK" Tragogo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tragogo v${{ github.run_number }}
          files: Tragogo.apk
